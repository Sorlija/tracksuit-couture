<!-- PROFILE -->
<section class="container py-5">
  <h1 class="mb-4">My profile</h1>
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card border-0 p-4 text-center">
        <div class="mx-auto mb-3 rounded-circle bg-dark text-white d-flex align-items-center justify-content-center" style="width:80px;height:80px">
          <span class="fs-3 tc-display">AH</span>
        </div>
        <h5 class="mb-0">Amina H.</h5>
        <small class="text-secondary">Customer since 2026</small>
        <a href="#orders" class="btn btn-outline-dark btn-sm mt-3">View my orders</a>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card border-0 p-4">
        <h5 class="fw-bold mb-3">Personal details</h5>
        <form>
          <div class="row g-3">
            <div class="col-sm-6"><label class="form-label" for="pFirst">First name</label><input id="pFirst" class="form-control" value="Amina"></div>
            <div class="col-sm-6"><label class="form-label" for="pLast">Last name</label><input id="pLast" class="form-control" value="Hodžić"></div>
            <div class="col-sm-6"><label class="form-label" for="pEmail">Email</label><input type="email" id="pEmail" class="form-control" value="amina@example.com"></div>
            <div class="col-sm-6"><label class="form-label" for="pPhone">Phone</label><input id="pPhone" class="form-control" value="+387 61 000 000"></div>
            <div class="col-12"><label class="form-label" for="pAddress">Address</label><input id="pAddress" class="form-control" value="Zmaja od Bosne 1"></div>
            <div class="col-sm-6"><label class="form-label" for="pCity">City</label><input id="pCity" class="form-control" value="Sarajevo"></div>
            <div class="col-sm-6"><label class="form-label" for="pCurrency">Preferred currency</label>
              <select id="pCurrency" class="form-select"><option>BAM</option><option>EUR</option><option>USD</option><option>GBP</option></select>
            </div>
          </div>
          <button type="submit" class="btn btn-gold mt-4">Save changes</button>
        </form>
      </div>
    </div>
  </div>
</section>
