<!-- LOGIN -->
<section class="container py-5">
  <div class="card border-0 p-4 mx-auto tc-auth-card">
    <h1 class="text-center">Welcome back</h1>
    <p class="text-center text-secondary">Log in to your Tracksuit Couture account</p>
    <form>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-gold w-100">Log in</button>
    </form>
    <p class="text-center small mt-3 mb-0">No account yet? <a href="#register" class="link-dark fw-semibold">Register</a></p>
  </div>
</section>
