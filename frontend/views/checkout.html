<!-- CHECKOUT -->
<section class="container py-5">
  <h1 class="mb-4">Checkout</h1>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card border-0 p-4">
        <h5 class="fw-bold mb-3">Shipping details</h5>
        <form>
          <div class="row g-3">
            <div class="col-sm-6"><label class="form-label" for="coFirst">First name</label><input id="coFirst" class="form-control" value="Amina"></div>
            <div class="col-sm-6"><label class="form-label" for="coLast">Last name</label><input id="coLast" class="form-control"></div>
            <div class="col-12"><label class="form-label" for="coAddress">Address</label><input id="coAddress" class="form-control" placeholder="Street and number"></div>
            <div class="col-sm-6"><label class="form-label" for="coCity">City</label><input id="coCity" class="form-control" placeholder="Sarajevo"></div>
            <div class="col-sm-3"><label class="form-label" for="coZip">ZIP</label><input id="coZip" class="form-control" placeholder="71000"></div>
            <div class="col-sm-3"><label class="form-label" for="coCountry">Country</label>
              <select id="coCountry" class="form-select"><option>BiH</option><option>Croatia</option><option>Serbia</option></select>
            </div>
            <div class="col-12"><label class="form-label" for="coPhone">Phone</label><input id="coPhone" class="form-control" placeholder="+387 6x xxx xxx"></div>
          </div>

          <h5 class="fw-bold mt-4 mb-3">Payment</h5>
          <div class="form-check"><input class="form-check-input" type="radio" name="pay" id="payCod" checked><label class="form-check-label" for="payCod">Cash on delivery</label></div>
          <div class="form-check mb-4"><input class="form-check-input" type="radio" name="pay" id="payCard"><label class="form-check-label" for="payCard">Card on delivery</label></div>

          <button type="submit" class="btn btn-gold w-100">Place order</button>
        </form>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card border-0 p-4">
        <h5 class="fw-bold">Order summary</h5>
        <div class="d-flex justify-content-between small"><span>Monaco Velour Tracksuit (M) x1</span><span>289.00 BAM</span></div>
        <div class="d-flex justify-content-between small"><span>Riviera Track Set (L) x1</span><span>219.00 BAM</span></div>
        <hr>
        <div class="d-flex justify-content-between fw-bold"><span>Total</span><span>508.00 BAM</span></div>
      </div>
    </div>
  </div>
</section>
