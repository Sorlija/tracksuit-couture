<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracksuit Couture</title>

  <!-- Bootstrap 5 + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="css/spapp.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ===== Navbar (always visible, never reloaded) ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark tc-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand tc-brand" href="#home">Tracksuit <span>Couture</span></a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-page="home" href="#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" data-page="shop" href="#shop">Shop</a></li>
          <li class="nav-item"><a class="nav-link" data-page="orders" href="#orders">My Orders</a></li>
          <!-- Will be visible only to admins in Milestone 4 -->
          <li class="nav-item"><a class="nav-link" data-page="admin" href="#admin">Admin</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <!-- External API feature (Frankfurter currency rates), connected in Milestone 3/4 -->
          <select id="currencySelect" class="form-select form-select-sm tc-currency" aria-label="Currency">
            <option value="BAM" selected>BAM</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
          </select>

          <a href="#cart" class="btn btn-outline-light btn-sm position-relative" data-page="cart">
            <i class="bi bi-bag"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill tc-badge">2</span>
          </a>

          <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#login">Log in</a></li>
              <li><a class="dropdown-item" href="#register">Register</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#profile">Profile</a></li>
              <li><a class="dropdown-item" href="#orders">My Orders</a></li>
              <li><a class="dropdown-item" href="#login">Log out</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== SPA views (spapp): every <section> is one page, loaded from views/ =====
       The URL hash picks the section: #shop shows <section id="shop">.
       NOTE: the LAST section is the default view (see css/spapp.css). -->
  <main id="spapp" role="main" class="tc-main">
    <section id="shop" data-load="shop.html"></section>
    <section id="product" data-load="product.html"></section>
    <section id="cart" data-load="cart.html"></section>
    <section id="checkout" data-load="checkout.html"></section>
    <section id="login" data-load="login.html"></section>
    <section id="register" data-load="register.html"></section>
    <section id="profile" data-load="profile.html"></section>
    <section id="orders" data-load="orders.html"></section>
    <section id="admin" data-load="admin.html"></section>
    <section id="error_404" data-load="404.html"></section>
    <section id="home" data-load="home.html"></section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="tc-footer">
    <div class="container py-4">
      <div class="row gy-3">
        <div class="col-md-6">
          <div class="tc-brand">Tracksuit <span>Couture</span></div>
          <p class="small text-secondary mb-0">Premium tracksuits, made for the street and the stage.</p>
        </div>
        <div class="col-md-6 text-md-end small text-secondary">
          <a href="#shop" class="text-secondary me-3">Shop</a>
          <a href="#profile" class="text-secondary me-3">Account</a>
          <span>&copy; 2026 Tracksuit Couture</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/lib/jquery.spapp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
